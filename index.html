<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yasena — Shaxsiy Media Arxiv</title>
  <style>
    :root {
      --primary: #059669;
      --primary-dark: #047857;
      --bg-overlay: rgba(15, 23, 42, 0.56);
      --card-bg: rgba(255, 255, 255, 0.96);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #dc2626;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      min-height: 100vh;
      background-color: #0f172a;
      background-image: linear-gradient(135deg, #064e3b 0%, #0f172a 100%);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--text-main);
    }
    .backdrop {
      min-height: 100vh;
      background: var(--bg-overlay);
      backdrop-filter: blur(3px);
      padding: 20px;
    }
    .login-wrap {
      min-height: calc(100vh - 40px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .logo-badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 20px;
      background: linear-gradient(135deg, #10b981, #047857);
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card h1 { font-size: 24px; margin-bottom: 6px; }
    .login-card p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
    .field { text-align: left; margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155; }
    .field input, .field select {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }
    .field input:focus, .field select:focus { border-color: var(--primary); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 16px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-admin { background: #f59e0b; color: #fff; }
    .btn-light { background: rgba(255, 255, 255, 0.16); color: #fff; border: 1px solid rgba(255, 255, 255, 0.28); }
    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
    .btn-outline { background: #ecfdf5; color: var(--primary-dark); border: 1px solid #a7f3d0; }
    .btn-danger { background: #fee2e2; color: var(--danger); }
    .err-box { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; display: none; }
    .ok-box { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; display: none; }
    .app-container { max-width: 1140px; margin: 0 auto; display: none; }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(15, 23, 42, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 16px 20px;
      border-radius: 20px;
      color: #fff;
      margin-bottom: 20px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon { width: 42px; height: 42px; border-radius: 12px; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; }
    .brand h2 { font-size: 19px; }
    .brand span { font-size: 12px; color: #cbd5e1; }
    .top-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .tab-btn { padding: 9px 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.25); background: rgba(15, 23, 42, 0.55); color: #f1f5f9; font-size: 14px; font-weight: 600; cursor: pointer; }
    .tab-btn.active { background: #fff; color: var(--text-main); border-color: #fff; }
    .status-bar { color: #f8fafc; font-size: 14px; font-weight: 500; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 16px; }
    .media-card { background: var(--card-bg); border-radius: 18px; overflow: hidden; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35); display: flex; flex-direction: column; }
    .media-thumb { height: 200px; background: #0f172a; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; overflow: hidden; }
    .media-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .media-badge { position: absolute; top: 10px; left: 10px; background: rgba(15, 23, 42, 0.8); color: #fff; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
    .icon-placeholder { color: #34d399; font-size: 46px; text-align: center; }
    .media-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .media-title { font-size: 14px; font-weight: 600; word-break: break-word; color: var(--text-main); }
    .media-meta { font-size: 12px; color: var(--text-muted); }
    .media-actions { margin-top: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; padding-top: 8px; border-top: 1px solid var(--border); }
    .link-btn { font-size: 12px; font-weight: 600; color: var(--primary); text-decoration: none; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
    .modal-box { background: #fff; width: 100%; max-width: 500px; border-radius: 24px; padding: 24px; max-height: 92vh; overflow-y: auto; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .close-btn { width: 34px; height: 34px; border-radius: 10px; border: none; background: #f1f5f9; font-size: 18px; cursor: pointer; }
    .cat-switch { display: grid; grid-template-columns: repeat(3, 1fr); background: #f1f5f9; padding: 4px; border-radius: 12px; margin-bottom: 16px; }
    .cat-opt { padding: 9px 6px; border: none; border-radius: 9px; background: transparent; font-size: 13px; font-weight: 600; color: #475569; cursor: pointer; }
    .cat-opt.active { background: var(--primary); color: #fff; }
    .dropzone { border: 2px dashed #10b981; background: #ecfdf5; border-radius: 16px; padding: 24px 16px; text-align: center; cursor: pointer; margin-bottom: 16px; }
    .dropzone p { font-size: 14px; font-weight: 600; color: #065f46; }
    .dropzone small { display: block; margin-top: 6px; color: #047857; font-size: 12px; }
    .progress-wrap { display: none; margin-bottom: 14px; }
    .progress-bar { width: 100%; height: 8px; background: #e2e8f0; border-radius: 999px; overflow: hidden; margin-top: 6px; }
    .progress-fill { height: 100%; width: 0%; background: var(--primary); transition: width 0.25s; }
    .voice-recorder { display: none; background: #f8fafc; border: 1px solid var(--border); border-radius: 14px; padding: 14px; text-align: center; margin-bottom: 16px; }
    .user-list { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
    .user-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #f8fafc; border: 1px solid var(--border); padding: 10px 12px; border-radius: 12px; }
